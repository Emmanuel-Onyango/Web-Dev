<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - GYMNATION</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="logo">GYM<span class="green">N</span><span class="red">ATION</span></div>
  </header>

  <div class="login-page">
    <section class="login-form">
      <h2>Member Login</h2>
      <form id="loginForm">
        <input type="text" id="admissionNumber" placeholder="Enter Membership ID" required />
        <input type="password" id="password" placeholder="Enter Password" required />
        <button type="submit">Log In</button>
      </form>
      <p id="loginMsg" style="margin-top: 20px; font-weight: bold;"></p>
    </section>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const admissionNumber = document.getElementById("admissionNumber").value;
      const password = document.getElementById("password").value;

      fetch("http://localhost:8080/api/members/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ admissionNumber, password }),
      })
      .then(response => {
        if (!response.ok) throw new Error('Login failed');
        return response.json(); // Expect JSON response from backend
      })
      .then(data => {
        // Assume backend returns JSON like { success: true, username: "John" }
        if (data.success) {
          // Redirect to dashboard with username in query param
          window.location.href = `dashboard.html?username=${encodeURIComponent(data.username)}`;
        } else {
          document.getElementById("loginMsg").innerText = data.message || "Invalid login credentials.";
        }
      })
      .catch(err => {
        document.getElementById("loginMsg").innerText = "Login failed. Please try again.";
        console.error(err);
      });
    });
  </script>
</body>
</html>
