<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - GYMNATION</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="logo">GYM<span class="green">N</span><span class="red">ATION</span></div>
  </header>

  <div class="login-page">
    <section class="login-form">
      <h2>Member Login</h2>
      <form id="loginForm">
        <input type="text" id="memberId" placeholder="Enter Membership ID" required />
        <button type="submit">Log In</button>
      </form>
      <p id="loginMsg" style="margin-top: 20px; font-weight: bold;"></p>
    </section>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const id = document.getElementById("loginId").value;
      const password = document.getElementById("loginPassword").value;
  
      fetch("http://localhost:8080/api/members/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ id, password }),
      })
        .then(response => response.text())
        .then(msg => {
          document.getElementById("loginMessage").innerText = msg;
        })
        .catch(error => console.error("Login failed:", error));
    });
  </script>
  
    
  
</body>
</html>
